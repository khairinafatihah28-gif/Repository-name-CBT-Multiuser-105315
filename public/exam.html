<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Kerjakan Ujian - SD Negeri 105315 | CBT App</title>
  <link rel="icon" href="/assets/logo-sekolah.svg">

  <link
    rel="stylesheet"
    href="/assets/app.css"
  >
</head>

<body>
  <header class="topbar">
    <div class="brand-row">
      <img class="school-logo small" src="/assets/logo-sekolah.svg" alt="Logo SD Negeri 105315">
      <div class="brand-text">
        <strong>SD Negeri 105315</strong>
        <span id="examTitle" class="muted"></span>
      </div>
    </div>

    <a
      id="backLink"
      class="button small"
      href="/dashboard.html"
    >
      Kembali
    </a>
  </header>

  <main class="container">
    <section class="card">
      <p class="eyebrow">
        Pengerjaan Ujian
      </p>

      <h1 id="title">
        Memuat ujian...
      </h1>

      <p
        id="description"
        class="muted"
      ></p>

      <div
        id="timer"
        class="timer hidden"
      ></div>

      <div
        id="message"
        class="message hidden"
      ></div>

      <form
        id="examForm"
        class="exam-form"
      ></form>
    </section>
  </main>

  <script>
    const token =
      localStorage.getItem('cbt_token');

    const user = JSON.parse(
      localStorage.getItem('cbt_user') || 'null'
    );

    if (!token || !user) {
      window.location.replace('/login.html');
    }

    const params = new URLSearchParams(
      window.location.search
    );

    const examId = Number(
      params.get('examId')
    );

    const headers = {
      Authorization: `Bearer ${token}`,
      'Content-Type': 'application/json'
    };

    const form =
      document.getElementById('examForm');

    const messageBox =
      document.getElementById('message');

    const title =
      document.getElementById('title');

    const description =
      document.getElementById('description');

    const examTitle =
      document.getElementById('examTitle');

    const timerBox =
      document.getElementById('timer');

    let timerInterval = null;
    let remainingSeconds = 0;
    let isSubmitting = false;
    let totalQuestions = 0;
    let examInProgress = false;

    const backLink =
      document.getElementById(
        'backLink'
      );

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function showMessage(
      text,
      type = 'error'
    ) {
      messageBox.className =
        `message ${type}`;

      messageBox.textContent = text;
    }

    function hideMessage() {
      messageBox.className =
        'message hidden';

      messageBox.textContent = '';
    }

    function lockExamNavigation() {
      examInProgress = true;

      backLink.textContent =
        'Ujian sedang berlangsung';

      backLink.classList.add(
        'disabled'
      );

      history.pushState(
        null,
        '',
        window.location.href
      );

      window.addEventListener(
        'popstate',
        handlePopState
      );

      window.addEventListener(
        'beforeunload',
        handleBeforeUnload
      );
    }

    function unlockExamNavigation() {
      examInProgress = false;

      backLink.textContent =
        'Kembali';

      backLink.classList.remove(
        'disabled'
      );

      window.removeEventListener(
        'popstate',
        handlePopState
      );

      window.removeEventListener(
        'beforeunload',
        handleBeforeUnload
      );
    }

    function handlePopState() {
      if (!examInProgress) {
        return;
      }

      history.pushState(
        null,
        '',
        window.location.href
      );

      showMessage(
        'Selesaikan terlebih dahulu ujian ini sebelum kembali.'
      );

      window.alert(
        'Selesaikan terlebih dahulu ujian ini sebelum kembali.'
      );
    }

    function handleBeforeUnload(
      event
    ) {
      if (!examInProgress) {
        return;
      }

      event.preventDefault();
      event.returnValue = '';
    }

    async function requestJson(
      url,
      options = {}
    ) {
      const response = await fetch(
        url,
        options
      );

      const data = await response
        .json()
        .catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          data.message ||
          'Terjadi kesalahan pada server.'
        );
      }

      return data;
    }

    function renderTimer() {
      const minutesLeft = Math.floor(
        remainingSeconds / 60
      );

      const secondsLeft =
        remainingSeconds % 60;

      timerBox.textContent =
        `Sisa waktu: ${minutesLeft}:` +
        String(secondsLeft).padStart(
          2,
          '0'
        );
    }

    function startTimer(
      durationMinutes,
      startedAt
    ) {
      const durationSeconds =
        Number(durationMinutes || 0) * 60;

      if (durationSeconds <= 0) {
        timerBox.className =
          'timer hidden';

        return;
      }

      const startedTime = startedAt
        ? new Date(startedAt).getTime()
        : Date.now();

      const validStartedTime =
        Number.isFinite(startedTime)
          ? startedTime
          : Date.now();

      const elapsedSeconds = Math.max(
        0,
        Math.floor(
          (
            Date.now() -
            validStartedTime
          ) / 1000
        )
      );

      remainingSeconds = Math.max(
        0,
        durationSeconds -
        elapsedSeconds
      );

      timerBox.className = 'timer';

      renderTimer();

      if (remainingSeconds <= 0) {
        showMessage(
          'Waktu ujian telah habis. Jawaban akan dikirim otomatis.',
          'error'
        );

        setTimeout(() => {
          submitExam(true);
        }, 500);

        return;
      }

      timerInterval = window.setInterval(
        () => {
          remainingSeconds -= 1;

          renderTimer();

          if (remainingSeconds <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;

            showMessage(
              'Waktu habis. Jawaban akan dikirim otomatis.',
              'error'
            );

            submitExam(true);
          }
        },
        1000
      );
    }

    function renderQuestions(questions) {
      totalQuestions = questions.length;

      if (questions.length === 0) {
        form.innerHTML = `
          <div class="message error">
            Ujian ini belum memiliki soal.
          </div>

          <a
            class="button"
            href="/dashboard.html"
          >
            Kembali ke Dashboard
          </a>
        `;

        return;
      }

      const questionHtml = questions
        .map((question, index) => {
          const options = Array.isArray(
            question.options
          )
            ? question.options
            : [];

          const optionHtml = options
            .map((option) => `
              <label class="option-row">
                <input
                  type="radio"
                  name="question_${Number(
                    question.id
                  )}"
                  value="${Number(option.id)}"
                  required
                >

                <span>
                  <strong>
                    ${escapeHtml(
                      option.option_label
                    )}.
                  </strong>

                  ${escapeHtml(
                    option.option_text
                  )}
                </span>
              </label>
            `)
            .join('');

          return `
            <fieldset
              class="question-card"
              data-question-id="${Number(
                question.id
              )}"
            >
              <legend>
                ${index + 1}.
                ${escapeHtml(
                  question.question_text
                )}
              </legend>

              ${optionHtml}
            </fieldset>
          `;
        })
        .join('');

      form.innerHTML = `
        ${questionHtml}

        <button
          id="submitButton"
          class="button primary full"
          type="submit"
        >
          Kirim Jawaban
        </button>
      `;
    }

    async function loadQuestions() {
      if (
        !Number.isInteger(examId) ||
        examId <= 0
      ) {
        showMessage(
          'ID ujian tidak valid.'
        );

        title.textContent =
          'Ujian tidak ditemukan';

        form.innerHTML = `
          <a
            class="button"
            href="/dashboard.html"
          >
            Kembali ke Dashboard
          </a>
        `;

        return;
      }

      try {
        hideMessage();

        const data = await requestJson(
          `/api/exams/${encodeURIComponent(
            examId
          )}/questions`,
          {
            headers
          }
        );

        const exam = data.exam || {};
        const attempt = data.attempt || {};

        const attemptNumber = Number(
          data.attempt_number ||
          data.total_attempts ||
          1
        );

        title.textContent =
          exam.title || 'Ujian';

        examTitle.textContent =
          `— ${exam.title || 'Ujian'}`;

        description.textContent =
          `${exam.subject_name || '-'} · ` +
          `Durasi ${Number(
            exam.duration_minutes || 0
          )} menit · ` +
          `Percobaan ${attemptNumber}/2`;

        renderQuestions(
          Array.isArray(data.questions)
            ? data.questions
            : []
        );

        if (totalQuestions > 0) {
          lockExamNavigation();
        }

        startTimer(
          exam.duration_minutes,
          attempt.started_at
        );
      } catch (error) {
        showMessage(
          error.message ||
          'Soal ujian gagal dimuat.'
        );

        title.textContent =
          'Ujian tidak dapat dibuka';

        form.innerHTML = `
          <a
            class="button primary"
            href="/dashboard.html"
          >
            Kembali ke Dashboard
          </a>
        `;
      }
    }

    function collectAnswers() {
      const answers = [];

      const questionCards =
        document.querySelectorAll(
          '.question-card'
        );

      questionCards.forEach(
        (questionCard) => {
          const questionId = Number(
            questionCard.dataset.questionId
          );

          const selectedOption =
            questionCard.querySelector(
              'input[type="radio"]:checked'
            );

          if (!selectedOption) {
            return;
          }

          answers.push({
            question_id: questionId,
            option_id: Number(
              selectedOption.value
            )
          });
        }
      );

      return answers;
    }

    async function submitExam(
      isAutomatic = false
    ) {
      if (isSubmitting) {
        return;
      }

      const answers = collectAnswers();

      if (
        !isAutomatic &&
        answers.length < totalQuestions
      ) {
        showMessage(
          'Semua soal wajib dijawab sebelum mengirim ujian.'
        );

        const firstUnanswered =
          Array.from(
            document.querySelectorAll(
              '.question-card'
            )
          ).find(
            (card) =>
              !card.querySelector(
                'input[type="radio"]:checked'
              )
          );

        if (firstUnanswered) {
          firstUnanswered.scrollIntoView({
            behavior: 'smooth',
            block: 'center'
          });
        }

        return;
      }

      if (
        !isAutomatic &&
        !window.confirm(
          'Apakah Anda yakin ingin mengirim jawaban?'
        )
      ) {
        return;
      }

      if (
        isAutomatic &&
        answers.length === 0
      ) {
        unlockExamNavigation();

        showMessage(
          'Waktu habis dan belum ada jawaban yang dipilih. Silakan kembali ke dashboard.'
        );

        form.innerHTML = `
          <a
            class="button primary"
            href="/dashboard.html"
          >
            Kembali ke Dashboard
          </a>
        `;

        return;
      }

      isSubmitting = true;

      const submitButton =
        document.getElementById(
          'submitButton'
        );

      if (submitButton) {
        submitButton.disabled = true;

        submitButton.textContent =
          isAutomatic
            ? 'Mengirim otomatis...'
            : 'Mengirim jawaban...';
      }

      try {
        const data = await requestJson(
          `/api/exams/${encodeURIComponent(
            examId
          )}/submit`,
          {
            method: 'POST',
            headers,
            body: JSON.stringify({
              answers
            })
          }
        );

        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }

        timerBox.className =
          'timer hidden';

        unlockExamNavigation();

        const completionText =
          data.is_completed
            ? 'Anda telah menyelesaikan ujian ini.'
            : 'Percobaan pertama selesai. Anda masih memiliki 1 kesempatan lagi.';

        showMessage(
          `${completionText} Nilai Anda: ${data.score}`,
          'success'
        );

        form.innerHTML = `
          <div class="panel">
            <p>
              Jawaban berhasil dikirim.
            </p>

            <p>
              Nilai:
              <strong>
                ${escapeHtml(data.score)}
              </strong>
            </p>

            <p>
              Percobaan selesai:
              <strong>
                ${escapeHtml(
                  data.completed_attempts || 1
                )} / 2
              </strong>
            </p>

            <a
              class="button primary"
              href="/dashboard.html"
            >
              Lihat Dashboard
            </a>
          </div>
        `;
      } catch (error) {
        isSubmitting = false;

        if (submitButton) {
          submitButton.disabled = false;
          submitButton.textContent =
            'Kirim Jawaban';
        }

        showMessage(
          error.message ||
          'Jawaban gagal dikirim.'
        );
      }
    }

    backLink.addEventListener(
      'click',
      (event) => {
        if (examInProgress) {
          event.preventDefault();

          showMessage(
            'Selesaikan terlebih dahulu ujian ini sebelum kembali.'
          );
        }
      }
    );

    form.addEventListener(
      'submit',
      (event) => {
        event.preventDefault();
        submitExam(false);
      }
    );

    loadQuestions();
  </script>
</body>
</html>
